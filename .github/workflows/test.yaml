name: "Test Devcontainer Features"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # principle of least privilege
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sets up Docker Buildx cleanly with the native GitHub cache mapping keys
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Devcontainers CLI
        run: npm install -g @devcontainers/cli

      - name: Run Feature Scenario Tests
        run: |
          devcontainer features test \
            --features agones-sdk-server \
            --project-folder .
        env:
          DOCKER_BUILDKIT: 1
          BUILD_ID: ${{ github.sha }}